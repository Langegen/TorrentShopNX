name = "tsnx-reports"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Secrets, set once with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#
# For a forum group, the topic to post into:
# [vars]
# TELEGRAM_THREAD_ID = "123"

# At most 3 reports a minute from one IP address...
[[ratelimits]]
name = "PER_IP_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

# ...and 30 a minute in total, so a flood cannot bury the chat.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
